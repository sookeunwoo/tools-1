<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Config Provider</title>
<!--
  이 UI는 본인이 복호화된 원본 평문을 직접 눈으로 확인하는 유일한 창구다 (스펙 §4.4).

  배치는 Postman 워크스페이스를 따른다: 상단 툴바 · 좌측 탐색기 · 가운데 고밀도 표 ·
  우측 인스펙터. 값은 예외 없이 표로 그린다 — 항목 × env 매트릭스가 기본 화면이고,
  인스펙터의 값·참조·메타·별칭·CLI도 전부 표다. 카드보다 표가 같은 높이에서 더 많은
  값을 같은 자리에 정렬해 보여주기 때문이다.

  외부 리소스를 하나도 쓰지 않는다(폰트·아이콘 CDN 포함). 이 페이지는 평문을 그리므로
  나가는 요청 경로를 만들지 않는다 — ui.ts의 CSP도 같은 기준으로 잠겨 있다.
-->
<style>
  :root {
    /* Postman 라이트 팔레트 */
    --bg: #f8f9fa; --panel: #ffffff; --panel-2: #fafbfc; --head: #f4f5f7;
    --line: #e4e5e7; --line-2: #d0d2d6; --text: #1e2022; --muted: #5a6068; --faint: #8b919a;
    --accent: #ff6c37; --accent-hover: #f05a24; --accent-soft: #fff2ec; --accent-line: #ffc9b3;
    --ok: #047857; --ok-bg: #ecfdf5; --ok-line: #a7f3d0;
    --warn: #b45309; --warn-bg: #fffbeb; --warn-line: #fde68a;
    --info: #1d4ed8; --info-bg: #eff6ff; --info-line: #bfdbfe;
    --danger: #dc2626; --danger-bg: #fef2f2; --danger-line: #fecaca;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sidebar: 232px; --toolbar: 46px; --inspector: 384px;
    --shadow: 0 1px 2px rgba(16, 18, 22, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1a1d23; --panel-2: #1f232b; --head: #20242c;
      --line: #2a2f39; --line-2: #3a4150; --text: #e6e8ee; --muted: #9aa3b2; --faint: #6f7787;
      --accent: #ff7a45; --accent-hover: #ff8a5b; --accent-soft: #2e1d15; --accent-line: #5c3524;
      --ok: #34d399; --ok-bg: #0f2a22; --ok-line: #1f5045;
      --warn: #fbbf24; --warn-bg: #2b2110; --warn-line: #57431a;
      --info: #60a5fa; --info-bg: #121f36; --info-line: #24406b;
      --danger: #f87171; --danger-bg: #2a1618; --danger-line: #5a2a2c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 13px/1.5 -apple-system, "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  code, .mono { font-family: var(--mono); }

  /* ── 상단 툴바 ─────────────────────────────────────────────── */
  .topbar {
    position: fixed; inset: 0 0 auto 0; height: var(--toolbar); z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 8px; width: calc(var(--sidebar) - 12px); flex: none; min-width: 0; }
  .logo {
    width: 26px; height: 26px; border-radius: 5px; flex: none; color: #fff;
    background: var(--accent); display: grid; place-items: center;
  }
  .brand b { font-size: 13.5px; letter-spacing: -.01em; }
  .tag {
    font: 600 9.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-line);
  }
  .omni { position: relative; flex: 1; max-width: 560px; }
  .omni .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  #q {
    width: 100%; background: var(--head); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 44px 6px 30px; font-size: 12.5px; color: var(--text);
  }
  #q:focus { outline: none; background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  kbd {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%); pointer-events: none;
    font: 600 10px/1 var(--mono); color: var(--muted); background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px;
  }
  .topactions { display: flex; align-items: center; gap: 6px; margin-left: auto; }

  /* ── 버튼 · 배지 ───────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 500; box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--head); border-color: var(--line-2); }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--head); color: var(--text); }
  .btn.danger:hover { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .iconbtn {
    display: inline-grid; place-items: center; width: 22px; height: 22px; cursor: pointer;
    border: 0; background: transparent; color: var(--muted); border-radius: 4px; padding: 0;
  }
  .iconbtn:hover { background: var(--head); color: var(--text); }
  .iconbtn.hot:hover { background: var(--accent-soft); color: var(--accent); }
  .iconbtn.warn:hover { background: var(--danger-bg); color: var(--danger); }
  .badge {
    display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
    font: 600 10px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); background: var(--head);
  }
  .badge.secret { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .badge.public { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }
  .badge.unset { color: var(--faint); background: transparent; border-style: dashed; }
  .badge.err { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-line); }
  .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
  .badge.accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: currentColor; }

  /* ── 좌측 탐색기 ───────────────────────────────────────────── */
  .sidebar {
    position: fixed; top: var(--toolbar); bottom: 0; left: 0; width: var(--sidebar); z-index: 30;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar nav { flex: 1; overflow-y: auto; padding: 8px; }
  .navhead {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 10px 8px 4px; font: 700 9.5px/1.4 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
  }
  .navitem {
    display: flex; align-items: center; gap: 7px; width: 100%; cursor: pointer; text-align: left;
    padding: 5px 8px; border-radius: 5px; border: 0; background: transparent; color: var(--muted);
    font-size: 12.5px; border-left: 2px solid transparent;
  }
  .navitem:hover { background: var(--head); color: var(--text); }
  .navitem.on { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .navitem .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navitem .count { font: 500 10.5px/1.6 var(--mono); color: var(--faint); background: var(--head); border-radius: 4px; padding: 0 5px; }
  .navitem.on .count { background: var(--panel); color: var(--accent); border: 1px solid var(--accent-line); }
  .storecard { border-top: 1px solid var(--line); padding: 10px; background: var(--panel-2); }
  .storecard .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .storecard .path { font: 400 10.5px/1.5 var(--mono); color: var(--muted); word-break: break-all; margin-top: 4px; }

  /* ── 본문 ──────────────────────────────────────────────────── */
  main { margin-left: var(--sidebar); padding: calc(var(--toolbar) + 14px) 16px 28px; }
  .crumbs { display: flex; align-items: center; gap: 6px; font: 500 11.5px/1.5 var(--mono); color: var(--faint); }
  .crumbs .sep { color: var(--line-2); }
  .titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 5px 0 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.015em; }
  .capsule {
    display: flex; align-items: center; gap: 8px; margin-left: auto; padding: 5px 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
    font-size: 11.5px; color: var(--muted);
  }
  .capsule b { color: var(--text); font-size: 12px; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; box-shadow: var(--shadow); }
  .metric:hover { border-color: var(--accent-line); }
  .metric .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .metric .name { font: 700 9.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .metric .num { font: 700 21px/1.2 var(--mono); letter-spacing: -.02em; }
  .metric .unit { font: 400 11.5px/1.2 var(--mono); color: var(--muted); }
  .metric .note { font: 400 11px/1.4 var(--mono); color: var(--muted); margin-top: 3px; }

  .filterbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; box-shadow: var(--shadow);
  }
  .pills { display: inline-flex; gap: 3px; padding: 2px; background: var(--head); border: 1px solid var(--line); border-radius: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer; border: 0; background: transparent;
    color: var(--muted); border-radius: 4px; padding: 3px 8px; font: 600 11.5px/1.5 var(--mono); white-space: nowrap;
  }
  .pill:hover { color: var(--text); }
  .pill.on { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
  select.sort {
    background: var(--head); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
    font-size: 11.5px; color: var(--muted); cursor: pointer;
  }
  .spacer { flex: 1; }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--inspector); gap: 10px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
  .gridwrap { overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .scroll { overflow-x: auto; }

  /* ── 표 ────────────────────────────────────────────────────── */
  table.grid { width: 100%; table-layout: fixed; border-collapse: collapse; }
  table.grid thead th {
    position: sticky; top: 0; z-index: 2; text-align: left; background: var(--head);
    border-bottom: 1px solid var(--line); padding: 6px 8px; color: var(--muted);
    font: 700 9.5px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; user-select: none;
  }
  table.grid th.env-h { border-left: 1px solid var(--line); }
  table.grid td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid td.envcell { border-left: 1px solid var(--line); }
  table.grid tr.row { cursor: pointer; }
  table.grid tr.row:hover td { background: var(--panel-2); }
  table.grid tr.row.on td { background: var(--accent-soft); }
  table.grid tr.row.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table.grid tr.row.checked td:first-child { box-shadow: inset 3px 0 0 var(--info); }
  .keycell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .keyname { font: 600 12px/1.5 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.row.on .keyname { color: var(--accent); }
  .sub { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 16px; }
  .chips { display: flex; gap: 3px; overflow: hidden; }
  .chip {
    font: 400 10.5px/1.6 var(--mono); background: var(--head); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .valcell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .val { font: 400 11.5px/1.6 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .val.masked { color: var(--muted); letter-spacing: 1.5px; }
  .val.plain { color: var(--ok); }
  .val.none { color: var(--faint); font-style: italic; }
  .val.bad { color: var(--danger); }
  .cellacts { display: flex; gap: 1px; flex: none; opacity: 0; transition: opacity .1s; }
  td:hover .cellacts, tr.row.on .cellacts { opacity: 1; }
  .rowacts { display: flex; gap: 1px; justify-content: flex-end; opacity: 0; transition: opacity .1s; }
  tr.row:hover .rowacts, tr.row.on .rowacts { opacity: 1; }
  input.inline {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--accent);
    border-radius: 4px; padding: 3px 6px; font: 400 11.5px/1.5 var(--mono);
  }
  input.inline:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
  .bulkbar {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--info-bg); border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--info);
  }
  .tfoot {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--head);
    border-top: 1px solid var(--line); font: 400 11.5px/1.6 var(--mono); color: var(--muted);
  }
  .blank { padding: 40px 16px; text-align: center; color: var(--faint); font-size: 12.5px; }

  /* ── 인스펙터 ──────────────────────────────────────────────── */
  .inspector { position: sticky; top: calc(var(--toolbar) + 14px); max-height: calc(100vh - var(--toolbar) - 28px); overflow-y: auto; }
  .insp-head { display: flex; align-items: flex-start; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .insp-head h2 { margin: 3px 0 0; font: 700 14px/1.3 var(--mono); color: var(--accent); word-break: break-all; }
  .section { padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .sechead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px;
    font: 700 9.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  }
  table.kv { width: 100%; table-layout: fixed; border-collapse: collapse; border: 1px solid var(--line); border-radius: 5px; }
  table.kv th, table.kv td { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.kv thead th {
    background: var(--head); font: 700 9.5px/1.5 var(--mono); letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint);
  }
  table.kv tbody th {
    width: 84px; background: var(--panel-2); font: 500 11px/1.5 var(--mono); color: var(--muted); font-weight: 500;
  }
  table.kv tr:last-child th, table.kv tr:last-child td { border-bottom: 0; }
  table.kv td { font: 400 11.5px/1.5 var(--mono); word-break: break-all; }
  table.kv .val { white-space: normal; overflow: visible; text-overflow: clip; word-break: break-all; }
  table.kv td.wrapv { white-space: pre-wrap; }
  .cmd {
    display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 6px; font: 400 11px/1.5 var(--mono); color: var(--text);
  }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
  .note { font-size: 11px; color: var(--muted); }
  .err { color: var(--danger); font-size: 11px; margin-top: 4px; }
  a { color: var(--accent); }

  /* ── 모달 · 토스트 ─────────────────────────────────────────── */
  .backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(12, 14, 18, .45); display: grid; place-items: center; padding: 20px; }
  .modal { width: min(560px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .28); }
  .modal header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .modal header b { font-size: 13.5px; }
  .modal .body { padding: 12px 14px; display: grid; gap: 10px; }
  .modal footer { display: flex; gap: 6px; justify-content: flex-end; padding: 11px 14px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .field { display: grid; gap: 4px; }
  .field > label { font: 700 9.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .field input[type=text], .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 5px;
    padding: 6px 8px; font: 400 12px/1.5 var(--mono); color: var(--text);
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field .hint { font-size: 11px; color: var(--faint); }
  .radios { display: flex; gap: 6px; }
  .radio { flex: 1; display: flex; gap: 7px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 5px; cursor: pointer; }
  .radio.on { border-color: var(--accent); background: var(--accent-soft); }
  .radio b { font-size: 12px; }
  .radio span { font-size: 10.5px; color: var(--muted); display: block; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 80; max-width: 70vw;
    background: var(--text); color: var(--bg); border-radius: 6px; padding: 8px 14px; font-size: 12.5px;
    opacity: 0; transition: opacity .15s; pointer-events: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  #toast.show { opacity: 1; }

  @media (max-width: 1180px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .inspector { position: static; max-height: none; }
  }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    main { margin-left: 0; }
    .brand { width: auto; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" id="logo"></span>
    <b>Config Provider</b>
    <span class="tag">studio</span>
  </div>
  <div class="omni">
    <span class="ico" id="qico"></span>
    <input id="q" placeholder="key · 별칭 · 설명으로 검색  (예: 입고지시)" autocomplete="off" spellcheck="false" autofocus />
    <kbd>/</kbd>
  </div>
  <div class="topactions">
    <span class="badge" id="daemon">연결 중…</span>
    <button class="btn" id="reload">reload</button>
    <button class="btn primary" id="new">새 항목</button>
  </div>
</header>

<aside class="sidebar">
  <nav id="nav"></nav>
  <div class="storecard" id="storecard"></div>
</aside>

<main>
  <div class="crumbs">
    <span>워크스페이스</span>
    <span class="sep">/</span>
    <span>설정 · 비밀값</span>
    <span class="sep">/</span>
    <span class="badge accent" id="crumb-scope">모든 env</span>
  </div>
  <div class="titlerow">
    <h1>설정 값 매트릭스</h1>
    <span class="badge" id="mode-badge"></span>
    <div class="capsule" id="capsule"></div>
  </div>

  <section class="metrics" id="metrics"></section>

  <section class="filterbar">
    <div class="pills" id="envpills"></div>
    <div class="pills" id="vispills"></div>
    <select class="sort" id="sort">
      <option value="key">정렬: key</option>
      <option value="unset">정렬: 미설정 먼저</option>
      <option value="secret">정렬: secret 먼저</option>
      <option value="type">정렬: 종류</option>
    </select>
    <span class="spacer"></span>
    <button class="btn" id="revealall"></button>
    <button class="btn" id="envcopy">.env 복사</button>
  </section>

  <div class="workspace">
    <div class="panel gridwrap">
      <div id="bulkbar"></div>
      <div class="scroll">
        <table class="grid" id="grid">
          <colgroup id="cols"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    <aside class="panel inspector" id="inspector"></aside>
  </div>
</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
// 평문 값을 localStorage·sessionStorage에 절대 넣지 않는다. 상태는 메모리에만 둔다(§4.4).
const state = {
  items: [], envs: [], defaultEnv: 'dev', degraded: false, status: null,
  q: '', envFilter: 'all', visFilter: 'all', navFilter: { kind: 'all', value: null }, sort: 'key',
  selected: null, editing: null, checked: new Set(), revealed: new Set(),
  revealAllUntil: 0, revealTimer: null, clipboardTimer: null, toastTimer: null,
};

const $ = (id) => document.getElementById(id);

/* ── 아이콘: 외부 아이콘 폰트를 쓰지 않는다(CSP·오프라인) ─────────────── */
const PATHS = {
  search: ['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z', 'm16.5 16.5 4 4'],
  send: ['m3 11 18-8-8 18-2.5-7.5L3 11Z'],
  eye: ['M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z', 'M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z'],
  eyeoff: ['m3 3 18 18', 'M10.6 10.6a3 3 0 0 0 4.2 4.2', 'M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.5 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.9-.8'],
  copy: ['M9 9h10v12H9z', 'M5 15H4V3h12v1'],
  edit: ['M4 20h4L20 8l-4-4L4 16v4Z', 'm14 6 4 4'],
  trash: ['M4 7h16', 'M9 7V4h6v3', 'M6 7l1 13h10l1-13'],
  plus: ['M12 5v14', 'M5 12h14'],
  close: ['m6 6 12 12', 'M18 6 6 18'],
  check: ['m5 13 4 4 10-10'],
  refresh: ['M20 12a8 8 0 1 1-2.3-5.6', 'M20 4v5h-5'],
  lock: ['M6 11h12v9H6z', 'M9 11V8a3 3 0 0 1 6 0v3'],
  unlock: ['M6 11h12v9H6z', 'M9 11V8a3 3 0 0 1 5.8-1.7'],
  key: ['M15 7a4 4 0 1 1-3.6 5.7L8 16.4V19H5v-3l6.3-6.3A4 4 0 0 1 15 7Z'],
  terminal: ['m5 7 4 4-4 4', 'M12 16h7'],
  link: ['M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1', 'M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1'],
  alert: ['M12 8v5', 'M12 17h.01', 'M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z'],
  folder: ['M3 6h6l2 2h10v11H3z'],
  layers: ['m12 3 9 5-9 5-9-5 9-5Z', 'm3 14 9 5 9-5'],
  tag: ['M3 12V4h8l9 9-8 8-9-9Z', 'M7.5 7.5h.01'],
  shield: ['M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6l8-3Z'],
  db: ['M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3Z', 'M20 6v12c0 1.7-3.6 3-8 3s-8-1.3-8-3V6'],
};
function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  for (const d of PATHS[name] ?? []) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.append(p);
  }
  return svg;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function iconBtn(name, title, onClick, extra = '') {
  const b = el('button', 'iconbtn' + (extra ? ' ' + extra : ''));
  b.type = 'button';
  b.title = title;
  b.append(icon(name, 13));
  b.onclick = (e) => { e.stopPropagation(); onClick(e); };
  return b;
}
function btn(label, onClick, className = 'btn', iconName) {
  const b = el('button', className);
  b.type = 'button';
  if (iconName) b.append(icon(iconName, 13));
  b.append(el('span', null, label));
  b.onclick = (e) => { e.stopPropagation(); onClick(e); };
  return b;
}

/* ── API ────────────────────────────────────────────────────── */
async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store',
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || !json.ok) {
    const e = json?.error ?? {};
    throw new Error((e.message ?? `HTTP ${res.status}`) + (e.hint ? ' — ' + e.hint : ''));
  }
  return json.data;
}

const REF_RE = /\{\{\s*([A-Za-z_][A-Za-z0-9_]*)\s*\}\}/g;

/** 템플릿에서 참조 key를 뽑는다. 서버는 목록 응답에 refs를 싣지 않는다. */
function refsOf(template) {
  if (typeof template !== 'string') return [];
  return [...new Set([...template.matchAll(REF_RE)].map((m) => m[1]))];
}

/**
 * API 응답을 화면이 쓰는 모양으로 정규화한다.
 *
 * 서버는 치환 결과(values)와 원본 템플릿(rawValues)을 따로 준다. 편집은 항상
 * 템플릿 기준이어야 하므로(치환 결과를 저장하면 참조가 상수로 굳는다) 둘을 한 칸에 묶는다.
 */
function normalizeItem(it) {
  const values = {};
  for (const env of it.envs ?? []) {
    const v = it.values?.[env];
    if (!v) continue;
    const template = it.rawValues ? (it.rawValues[env] ?? null) : null;
    values[env] = {
      template,
      resolved: v.value,
      status: v.status === 'ok' ? 'set' : v.status, // ok | unset | locked | error
      refs: refsOf(template),
      error: v.error,
    };
  }
  return {
    key: it.key,
    alias: it.alias ?? [],
    resource_type: it.resourceType ?? '',
    desc: it.desc ?? '',
    ref: it.ref ?? '',
    visibility: it.visibility,
    declared: it.declaredVisibility,
    locked: it.locked,
    version: it.version,
    values,
  };
}

async function load() {
  const [status, data] = await Promise.all([api('GET', '/status'), api('GET', '/items?values=true')]);
  state.status = status;
  state.items = data.items.map(normalizeItem);
  state.envs = status.envs?.length
    ? status.envs
    : [...new Set(state.items.flatMap((i) => Object.keys(i.values)))].sort();
  state.defaultEnv = status.defaultEnv ?? 'dev';
  state.degraded = status.mode !== 'full';
  if (state.envFilter !== 'all' && !state.envs.includes(state.envFilter)) state.envFilter = 'all';
  if (state.selected && !state.items.some((i) => i.key === state.selected)) state.selected = null;
  renderAll();
}

/* ── 파생 계산 ──────────────────────────────────────────────── */
function itemOf(key) { return state.items.find((i) => i.key === key) ?? null; }
function visibleEnvs() { return state.envFilter === 'all' ? state.envs : [state.envFilter]; }
function isSecret(item) { return item.visibility === 'secret'; }
function revealActive() { return state.revealAllUntil > Date.now(); }
function isRevealed(item, env) {
  if (!isSecret(item)) return true;
  return revealActive() || state.revealed.has(`${item.key}::${env}`);
}
function envStat(env) {
  let set = 0, unset = 0, defined = 0;
  for (const item of state.items) {
    const v = item.values[env];
    if (!v) continue;
    defined++;
    v.status === 'set' ? set++ : unset++;
  }
  return { set, unset, defined };
}
/** 참조가 깨졌거나 축소 모드로 잠긴 값 — 둘 다 '지금 못 쓰는 값'이라 같이 센다. */
function errorCount() {
  return state.items.filter((i) =>
    Object.values(i.values).some((v) => v && (v.status === 'error' || v.status === 'locked'))).length;
}
function unsetCount() {
  return state.items.filter((i) => Object.values(i.values).some((v) => v && v.status === 'unset')).length;
}
function typeGroups() {
  const map = new Map();
  for (const item of state.items) {
    const t = item.resource_type || '(분류 없음)';
    map.set(t, (map.get(t) ?? 0) + 1);
  }
  return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function matchesQuery(item, q) {
  if (!q) return true;
  const n = (s) => (s || '').replace(/\s+/g, '').toLowerCase();
  const needle = n(q);
  return n(item.key).includes(needle) || n(item.desc).includes(needle) ||
    n(item.resource_type).includes(needle) || item.alias.some((a) => n(a).includes(needle));
}

function filtered() {
  const nav = state.navFilter;
  let rows = state.items.filter((item) => {
    if (!matchesQuery(item, state.q)) return false;
    if (state.visFilter !== 'all' && item.visibility !== state.visFilter) return false;
    if (state.envFilter !== 'all' && !item.values[state.envFilter]) return false;
    if (nav.kind === 'type' && (item.resource_type || '(분류 없음)') !== nav.value) return false;
    if (nav.kind === 'unset' && !Object.values(item.values).some((v) => v && v.status === 'unset')) return false;
    if (nav.kind === 'error' && !Object.values(item.values).some((v) => v && (v.status === 'error' || v.status === 'locked'))) return false;
    if (nav.kind === 'ref' && !Object.values(item.values).some((v) => v && v.refs && v.refs.length)) return false;
    return true;
  });
  const byKey = (a, b) => a.key.localeCompare(b.key);
  const unsetRank = (i) => (Object.values(i.values).some((v) => v && v.status === 'unset') ? 0 : 1);
  if (state.sort === 'unset') rows = rows.sort((a, b) => unsetRank(a) - unsetRank(b) || byKey(a, b));
  else if (state.sort === 'secret') rows = rows.sort((a, b) => Number(isSecret(b)) - Number(isSecret(a)) || byKey(a, b));
  else if (state.sort === 'type') rows = rows.sort((a, b) => (a.resource_type || '~').localeCompare(b.resource_type || '~') || byKey(a, b));
  else rows = rows.sort(byKey);
  return rows;
}

/* ── 렌더 ───────────────────────────────────────────────────── */
function renderAll() {
  renderHeader();
  renderNav();
  renderMetrics();
  renderFilters();
  renderTable();
  renderInspector();
}

function renderHeader() {
  const s = state.status;
  const daemon = $('daemon');
  daemon.textContent = '';
  daemon.className = 'badge ' + (state.degraded ? 'err' : 'ok');
  daemon.append(icon(state.degraded ? 'unlock' : 'lock', 12), el('span', null, state.degraded ? '축소 모드' : 'full'));

  const mode = $('mode-badge');
  mode.textContent = '';
  mode.className = 'badge ' + (state.degraded ? 'err' : 'ok');
  mode.append(el('span', 'dot'), el('span', null, state.degraded ? 'secret 값 잠김 — dkc doctor' : '데몬 연결됨'));

  $('crumb-scope').textContent = state.envFilter === 'all' ? '모든 env' : `env: ${state.envFilter}`;

  const cap = $('capsule');
  cap.textContent = '';
  cap.append(icon('layers', 14));
  const box = el('div');
  const line1 = el('div');
  line1.append(el('b', null, `${state.items.length}개 항목`), el('span', null, ` · env ${state.envs.join(' / ') || '없음'}`));
  const line2 = el('div', 'mono');
  line2.style.fontSize = '11px';
  line2.textContent = `기본 env ${state.defaultEnv}` +
    (s ? ` · secret ${s.secretItems}개 · 로드 ${new Date(s.loadedAt).toLocaleTimeString('ko-KR')}` : '');
  box.append(line1, line2);
  cap.append(box);
}

function renderNav() {
  const nav = $('nav');
  nav.textContent = '';

  const group = (title, action) => {
    const h = el('div', 'navhead');
    h.append(el('span', null, title));
    if (action) h.append(action);
    nav.append(h);
  };
  const item = (opts) => {
    const b = el('button', 'navitem' + (opts.on ? ' on' : ''));
    b.type = 'button';
    if (opts.icon) b.append(icon(opts.icon, 14));
    if (opts.badge) b.append(opts.badge);
    b.append(el('span', 'label', opts.label));
    if (opts.count !== undefined) b.append(el('span', 'count', String(opts.count)));
    b.onclick = opts.onClick;
    nav.append(b);
    return b;
  };

  group('탐색기');
  item({
    icon: 'folder', label: '전체 항목', count: state.items.length,
    on: state.navFilter.kind === 'all' && state.envFilter === 'all' && state.visFilter === 'all',
    onClick: () => { state.navFilter = { kind: 'all', value: null }; state.envFilter = 'all'; state.visFilter = 'all'; renderAll(); },
  });

  group('env');
  for (const env of state.envs) {
    const stat = envStat(env);
    const badge = el('span', 'badge ' + (env === 'prod' ? 'secret' : 'public'), env.slice(0, 4).toUpperCase());
    item({
      badge, label: env, count: stat.defined, on: state.envFilter === env,
      onClick: () => { state.envFilter = state.envFilter === env ? 'all' : env; renderAll(); },
    });
  }

  group('분류');
  for (const [type, count] of typeGroups()) {
    item({
      icon: 'db', label: type, count,
      on: state.navFilter.kind === 'type' && state.navFilter.value === type,
      onClick: () => {
        state.navFilter = state.navFilter.value === type ? { kind: 'all', value: null } : { kind: 'type', value: type };
        renderAll();
      },
    });
  }

  group('상태');
  const flag = (kind, label, iconName, count) => item({
    icon: iconName, label, count, on: state.navFilter.kind === kind,
    onClick: () => {
      state.navFilter = state.navFilter.kind === kind ? { kind: 'all', value: null } : { kind, value: null };
      renderAll();
    },
  });
  flag('unset', '미설정 포함', 'alert', unsetCount());
  flag('error', '참조 오류', 'alert', errorCount());
  flag('ref', '참조 사용', 'link', state.items.filter((i) => Object.values(i.values).some((v) => v && v.refs && v.refs.length)).length);

  const s = state.status;
  const card = $('storecard');
  card.textContent = '';
  const row = el('div', 'row');
  row.append(el('span', 'navhead', '데몬 · 정책'));
  const mark = el('span', 'badge ' + (state.degraded ? 'err' : 'ok'));
  mark.append(el('span', 'dot'), el('span', null, state.degraded ? 'reduced' : 'sops+age'));
  row.append(mark);
  card.append(row);
  card.append(el('div', 'path', s?.policyLoaded ? `정책: ${s.policyPath}` : '정책 파일 없음 — 에이전트 기본 deny'));
  if (state.degraded && s?.degradedReason) card.append(el('div', 'err', s.degradedReason));
  for (const w of s?.warnings ?? []) card.append(el('div', 'err', w));
}

function renderMetrics() {
  const box = $('metrics');
  box.textContent = '';
  const card = (name, iconName, num, unit, note, tone) => {
    const c = el('div', 'metric');
    const top = el('div', 'top');
    top.append(el('span', 'name', name), icon(iconName, 15));
    top.lastChild.style.color = tone ? `var(--${tone})` : 'var(--faint)';
    const numRow = el('div');
    numRow.style.cssText = 'display:flex;align-items:baseline;gap:6px;margin-top:4px';
    numRow.append(el('span', 'num', num), el('span', 'unit', unit));
    c.append(top, numRow, el('div', 'note', note));
    box.append(c);
  };

  const secrets = state.items.filter(isSecret).length;
  card('전체 항목', 'key', String(state.items.length), '개', `public ${state.items.length - secrets} · secret ${secrets}`, 'accent');
  for (const env of state.envs) {
    const stat = envStat(env);
    card(env, env === 'prod' ? 'shield' : 'layers', String(stat.set), `/ ${stat.defined} 설정됨`,
      stat.unset ? `미설정 ${stat.unset}개` : '미설정 없음', env === 'prod' ? 'ok' : 'info');
  }
  const errors = errorCount();
  card('무결성', errors ? 'alert' : 'check', errors ? String(errors) : '정상', errors ? '개 항목 문제' : '',
    state.degraded ? '축소 모드 — secret 값 잠김' : '모든 참조가 치환됩니다', errors ? 'danger' : 'ok');
}

function renderFilters() {
  const envpills = $('envpills');
  envpills.textContent = '';
  const pill = (host, label, on, onClick, dotTone) => {
    const b = el('button', 'pill' + (on ? ' on' : ''));
    b.type = 'button';
    if (dotTone) {
      const d = el('span', 'dot');
      d.style.color = `var(--${dotTone})`;
      b.append(d);
    }
    b.append(el('span', null, label));
    b.onclick = onClick;
    host.append(b);
  };
  pill(envpills, `ALL (${state.items.length})`, state.envFilter === 'all', () => { state.envFilter = 'all'; renderAll(); });
  for (const env of state.envs) {
    const stat = envStat(env);
    pill(envpills, `${env.toUpperCase()} (${stat.defined})`, state.envFilter === env,
      () => { state.envFilter = env; renderAll(); }, env === 'prod' ? 'ok' : 'info');
  }

  const vispills = $('vispills');
  vispills.textContent = '';
  const secrets = state.items.filter(isSecret).length;
  pill(vispills, '전체', state.visFilter === 'all', () => { state.visFilter = 'all'; renderAll(); });
  pill(vispills, `public ${state.items.length - secrets}`, state.visFilter === 'public', () => { state.visFilter = 'public'; renderAll(); }, 'info');
  pill(vispills, `secret ${secrets}`, state.visFilter === 'secret', () => { state.visFilter = 'secret'; renderAll(); }, 'warn');

  $('sort').value = state.sort;

  const reveal = $('revealall');
  reveal.textContent = '';
  const on = revealActive();
  reveal.append(icon(on ? 'eyeoff' : 'eye', 13));
  reveal.append(el('span', null, on ? `가리기 (${Math.ceil((state.revealAllUntil - Date.now()) / 1000)}s)` : '전체 보기 (15s)'));
}

const COLS = { check: '30px', key: '21%', alias: '12%', type: '8%', acts: '76px' };

/** 좁은 화면에서는 별칭·종류 열을 접는다 — 값 열의 폭이 이 화면의 목적이다. */
function compact() { return window.innerWidth < 1280; }

function renderTable() {
  const rows = filtered();
  const envs = visibleEnvs();
  const wide = !compact();

  const cols = $('cols');
  cols.textContent = '';
  const addCol = (w) => { const c = el('col'); if (w) c.style.width = w; cols.append(c); };
  addCol(COLS.check);
  addCol(wide ? COLS.key : '26%');
  if (wide) { addCol(COLS.alias); addCol(COLS.type); }
  for (const _ of envs) addCol(null);
  addCol(COLS.acts);

  const thead = $('thead');
  thead.textContent = '';
  const tr = el('tr');
  const th = (label, className) => { const n = el('th', className, label); tr.append(n); return n; };
  const all = el('input');
  all.type = 'checkbox';
  all.checked = rows.length > 0 && rows.every((r) => state.checked.has(r.key));
  all.onclick = (e) => {
    e.stopPropagation();
    if (all.checked) for (const r of rows) state.checked.add(r.key);
    else for (const r of rows) state.checked.delete(r.key);
    renderTable();
  };
  const cth = el('th');
  cth.style.textAlign = 'center';
  cth.append(all);
  tr.append(cth);
  th('key');
  if (wide) { th('별칭'); th('종류'); }
  for (const env of envs) {
    // th 자체를 flex로 만들면 셀이 표 레이아웃에서 빠진다 — 안쪽 div를 flex로 둔다.
    const wrap = el('div');
    wrap.style.cssText = 'display:flex;gap:6px;align-items:center';
    wrap.append(el('span', null, env));
    if (env === state.defaultEnv) wrap.append(el('span', 'badge accent', '기본'));
    th('', 'env-h').append(wrap);
  }
  th('작업').style.textAlign = 'right';
  thead.append(tr);

  const tbody = $('tbody');
  tbody.textContent = '';
  if (rows.length === 0) {
    const blank = el('tr');
    const td = el('td', 'blank', state.q || state.navFilter.kind !== 'all' ? '조건에 맞는 항목이 없습니다.' : '항목이 없습니다. dkc init으로 저장소를 만드세요.');
    td.colSpan = envs.length + (wide ? 5 : 3);
    blank.append(td);
    tbody.append(blank);
  } else {
    for (const item of rows) tbody.append(renderRow(item, envs, wide));
  }

  renderBulkBar(rows);
  const foot = $('tfoot');
  foot.textContent = '';
  foot.append(el('span', null, `${rows.length}개 표시 / 전체 ${state.items.length}개`));
  if (state.checked.size) foot.append(el('span', null, '·'), el('span', null, `선택 ${state.checked.size}개`));
  foot.append(el('span', null, '·'), el('span', null, `env 열 ${envs.join(', ') || '없음'}`));
  const legend = el('span', null, '● 마스킹 · 클릭으로 상세');
  legend.style.marginLeft = 'auto';
  foot.append(legend);
}

function renderBulkBar(rows) {
  const bar = $('bulkbar');
  bar.textContent = '';
  if (state.checked.size === 0) { bar.className = ''; return; }
  bar.className = 'bulkbar';
  bar.append(icon('check', 14), el('span', null, `${state.checked.size}개 선택됨`));
  const spacer = el('span', 'spacer');
  bar.append(spacer);
  bar.append(btn('.env로 복사', () => copyEnvFile([...state.checked]), 'btn', 'copy'));
  bar.append(btn('선택 해제', () => { state.checked.clear(); renderTable(); }, 'btn ghost'));
}

function renderRow(item, envs, wide) {
  const tr = el('tr', 'row' + (state.selected === item.key ? ' on' : '') + (state.checked.has(item.key) ? ' checked' : ''));
  tr.onclick = () => { state.selected = item.key; renderTable(); renderInspector(); };

  const check = el('td');
  check.style.textAlign = 'center';
  const box = el('input');
  box.type = 'checkbox';
  box.checked = state.checked.has(item.key);
  box.onclick = (e) => {
    e.stopPropagation();
    box.checked ? state.checked.add(item.key) : state.checked.delete(item.key);
    renderTable();
  };
  check.append(box);
  tr.append(check);

  const keyTd = el('td');
  const head = el('div', 'keycell');
  head.append(icon(isSecret(item) ? 'lock' : 'unlock', 13));
  head.lastChild.style.color = isSecret(item) ? 'var(--warn)' : 'var(--faint)';
  head.append(el('span', 'keyname', item.key));
  if (item.declared === 'public' && item.visibility === 'secret') {
    const b = el('span', 'badge secret', '참조');
    b.title = '이 항목은 public으로 선언됐지만 secret을 참조해 실효 secret입니다';
    head.append(b);
  }
  const sub = [item.resource_type, item.desc].filter(Boolean).join(' · ');
  keyTd.append(head, el('div', 'sub', wide ? item.desc || '' : sub));
  tr.append(keyTd);

  if (wide) {
    const aliasTd = el('td');
    const chips = el('div', 'chips');
    if (item.alias.length === 0) chips.append(el('span', 'sub', '—'));
    for (const alias of item.alias.slice(0, 2)) chips.append(el('span', 'chip', alias));
    if (item.alias.length > 2) chips.append(el('span', 'chip', `+${item.alias.length - 2}`));
    aliasTd.append(chips);
    tr.append(aliasTd);

    const typeTd = el('td');
    typeTd.append(item.resource_type ? el('span', 'chip', item.resource_type) : el('span', 'sub', '—'));
    tr.append(typeTd);
  }

  for (const env of envs) tr.append(renderValueCell(item, env));

  const actTd = el('td');
  const acts = el('div', 'rowacts');
  acts.append(iconBtn('terminal', 'CLI 명령 복사', () => {
    copyText(`dkc get ${item.key} --env ${state.envFilter === 'all' ? state.defaultEnv : state.envFilter}`, false);
  }));
  acts.append(iconBtn('tag', '메타 · 별칭 편집', () => openMetaModal(item)));
  acts.append(iconBtn('link', '상세 열기', () => { state.selected = item.key; renderTable(); renderInspector(); }, 'hot'));
  actTd.append(acts);
  tr.append(actTd);
  return tr;
}

function renderValueCell(item, env) {
  const td = el('td', 'envcell');
  const value = item.values[env];
  if (!value) {
    td.append(el('div', 'val none', '정의 없음'));
    return td;
  }
  const id = `${item.key}::${env}`;

  if (state.editing === id) {
    const input = el('input', 'inline');
    // 편집은 항상 템플릿(원본) 기준이다. 치환 결과를 저장하면 참조가 상수로 굳어버린다.
    input.value = value.template ?? '';
    input.placeholder = '값 (참조는 {{OTHER_KEY}})';
    const save = () => putValue(item, env, input.value);
    input.onclick = (e) => e.stopPropagation();
    input.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') { state.editing = null; renderTable(); }
    };
    const wrap = el('div', 'valcell');
    wrap.append(input, iconBtn('check', '저장 (Enter)', save, 'hot'), iconBtn('close', '취소 (Esc)', () => { state.editing = null; renderTable(); }));
    td.append(wrap);
    setTimeout(() => { input.focus(); input.select(); }, 0);
    return td;
  }

  const wrap = el('div', 'valcell');
  const revealed = isRevealed(item, env);
  const line = valueLine(item, env, value, revealed);
  wrap.append(line);

  const acts = el('div', 'cellacts');
  if (isSecret(item) && value.status === 'set') {
    acts.append(iconBtn(revealed ? 'eyeoff' : 'eye', revealed ? '가리기' : '평문 보기', () => toggleReveal(item, env)));
  }
  if (value.status === 'set' && value.resolved !== null) {
    acts.append(iconBtn('copy', '값 복사 (30초 뒤 클립보드 비움)', () => copyValue(value.resolved), 'hot'));
  }
  if (value.status !== 'locked') {
    acts.append(iconBtn('edit', '편집', () => { state.editing = `${item.key}::${env}`; renderTable(); }));
  }
  wrap.append(acts);
  td.append(wrap);
  return td;
}

/** 값 한 줄. 상태 4가지(set·unset·locked·error)를 한 곳에서 그린다. */
function valueLine(item, env, value, revealed) {
  if (value.status === 'unset') return el('div', 'val none', '미설정 (null)');
  if (value.status === 'locked') {
    const node = el('div', 'val none', '잠김 (축소 모드)');
    node.title = '암호문만 읽은 상태입니다. age 개인키를 두고 reload하세요.';
    return node;
  }
  if (value.status === 'error') {
    const node = el('div', 'val bad', `치환 실패 · ${value.error ?? ''}`);
    node.title = value.error ?? '';
    return node;
  }
  if (revealed) return el('div', 'val ' + (isSecret(item) ? 'plain' : ''), value.resolved === '' ? '(빈 문자열)' : value.resolved ?? '');
  return el('div', 'val masked', maskOf(value.resolved));
}

function toggleReveal(item, env) {
  const id = `${item.key}::${env}`;
  state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id);
  renderTable();
  renderInspector();
}

/** 값 쓰기의 단일 통로. 낙관적 잠금 version은 서버가 필수로 요구한다(§4.5). */
function putValue(item, env, value) {
  return act(
    () => api('PUT', `/value/${encodeURIComponent(item.key)}`, { env, value, version: item.version }),
    value === null ? `${item.key}(${env})를 미설정으로 바꿨습니다` : `${item.key}(${env})를 저장했습니다`,
  );
}

/* ── 인스펙터: 값·메타·참조·CLI를 모두 표로 고정한다 ─────────────── */
function renderInspector() {
  const panel = $('inspector');
  panel.textContent = '';
  const item = state.selected ? itemOf(state.selected) : null;

  if (!item) {
    const blank = el('div', 'blank');
    blank.append(icon('layers', 22));
    blank.append(el('div', null, '행을 선택하면 값·참조·CLI 사용법이 여기에 표로 나옵니다.'));
    panel.append(blank);
    return;
  }

  const head = el('div', 'insp-head');
  const left = el('div');
  left.style.minWidth = '0';
  const badges = el('div');
  badges.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap';
  badges.append(el('span', 'badge ' + (isSecret(item) ? 'secret' : 'public'), item.visibility));
  if (item.declared !== item.visibility) badges.append(el('span', 'badge', `선언 ${item.declared}`));
  if (item.resource_type) badges.append(el('span', 'badge', item.resource_type));
  left.append(badges, el('h2', null, item.key));
  head.append(left);
  const close = iconBtn('close', '닫기', () => { state.selected = null; renderTable(); renderInspector(); });
  close.style.marginLeft = 'auto';
  head.append(close);
  panel.append(head);

  panel.append(valueSection(item));
  const refs = refSection(item);
  if (refs) panel.append(refs);
  panel.append(metaSection(item));
  panel.append(aliasSection(item));
  panel.append(cliSection(item));

  const actions = el('div', 'section');
  const row = el('div');
  row.style.cssText = 'display:flex;gap:6px';
  row.append(btn('메타 편집', () => openMetaModal(item), 'btn', 'edit'));
  row.append(btn('값 편집', () => {
    const env = state.envFilter === 'all' ? state.defaultEnv : state.envFilter;
    state.editing = `${item.key}::${item.values[env] ? env : Object.keys(item.values).find((e) => item.values[e]) ?? env}`;
    renderTable();
  }, 'btn', 'terminal'));
  row.append(btn('.env 복사', () => copyEnvFile([item.key]), 'btn', 'copy'));
  actions.append(row);
  panel.append(actions);
}

function kvTable(rows, headers, widths) {
  const table = el('table', 'kv');
  if (widths) {
    const cg = el('colgroup');
    for (const w of widths) {
      const c = el('col');
      if (w) c.style.width = w;
      cg.append(c);
    }
    table.append(cg);
  }
  if (headers) {
    const thead = el('thead');
    const tr = el('tr');
    for (const h of headers) tr.append(el('th', null, h));
    thead.append(tr);
    table.append(thead);
  }
  const tbody = el('tbody');
  for (const row of rows) {
    const tr = el('tr');
    row.forEach((cell, i) => {
      const isHead = !headers && i === 0;
      const td = el(isHead ? 'th' : 'td');
      if (typeof cell === 'string') td.textContent = cell;
      else if (cell) td.append(cell);
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(tbody);
  return table;
}

function section(title, action) {
  const box = el('div', 'section');
  const head = el('div', 'sechead');
  head.append(el('span', null, title));
  if (action) head.append(action);
  box.append(head);
  return box;
}

function valueSection(item) {
  const anySecret = isSecret(item);
  const allShown = state.envs.every((e) => isRevealed(item, e));
  const toggle = anySecret
    ? btn(allShown ? '모두 가리기' : '모두 보기', () => {
        for (const env of state.envs) {
          const id = `${item.key}::${env}`;
          allShown ? state.revealed.delete(id) : state.revealed.add(id);
        }
        renderTable();
        renderInspector();
      }, 'btn ghost')
    : null;
  const box = section('환경별 값', toggle);

  const STATUS_TONE = { set: 'ok', unset: 'unset', locked: 'err', error: 'err' };
  const rows = [];
  for (const env of state.envs) {
    const value = item.values[env];
    const envCell = el('span', 'badge ' + (env === 'prod' ? 'secret' : 'public'), env);
    if (!value) {
      rows.push([envCell, el('span', 'badge unset', '정의 없음'), el('span', 'val none', '—'), el('span')]);
      continue;
    }
    const revealed = isRevealed(item, env);
    const valNode = valueLine(item, env, value, revealed);
    if (value.status === 'set' && revealed && anySecret) valNode.style.color = 'var(--ok)';
    const statusNode = el('span', 'badge ' + STATUS_TONE[value.status], value.status);

    const acts = el('div');
    acts.style.cssText = 'display:flex;gap:1px;justify-content:flex-end';
    if (anySecret && value.status === 'set') {
      acts.append(iconBtn(revealed ? 'eyeoff' : 'eye', revealed ? '가리기' : '평문 보기', () => toggleReveal(item, env)));
    }
    if (value.status === 'set' && value.resolved !== null) {
      acts.append(iconBtn('copy', '값 복사', () => copyValue(value.resolved), 'hot'));
    }
    if (value.status !== 'locked') {
      acts.append(iconBtn('edit', '편집', () => { state.editing = `${item.key}::${env}`; renderTable(); }));
    }
    if (value.status === 'set') {
      acts.append(iconBtn('trash', '미설정(null)으로 되돌리기', () => {
        if (!confirm(`${item.key}(${env})를 미설정으로 되돌릴까요?`)) return;
        putValue(item, env, null);
      }, 'warn'));
    }
    rows.push([envCell, statusNode, valNode, acts]);
  }

  box.append(kvTable(rows, ['env', '상태', '값', ''], ['54px', '52px', null, '74px']));

  for (const env of state.envs) {
    const v = item.values[env];
    if (v && v.status === 'error') box.append(el('div', 'err', `${env}: ${v.error}`));
  }
  return box;
}

function refSection(item) {
  const rows = [];
  for (const env of state.envs) {
    const value = item.values[env];
    if (!value || !value.refs || value.refs.length === 0 || !value.template) continue;
    // 템플릿 마스킹 기준은 실효 visibility가 아니라 declared다. public 항목의 템플릿에는
    // 참조 '이름'만 들어 있고 비밀값은 없다 — 가리면 정보만 잃는다(§4.4 구현 메모).
    const hide = item.declared === 'secret' && !isRevealed(item, env);
    const tmpl = el('span', null, hide ? maskOf(value.template) : value.template);
    const links = el('div');
    links.style.cssText = 'display:flex;gap:3px;flex-wrap:wrap';
    for (const ref of value.refs) {
      const chip = el('button', 'chip on', ref);
      chip.type = 'button';
      chip.style.cursor = 'pointer';
      chip.onclick = () => { state.selected = ref; renderTable(); renderInspector(); };
      links.append(chip);
    }
    rows.push([el('span', 'badge', env), tmpl, links]);
  }
  if (rows.length === 0) return null;
  const box = section('참조 · 원본 템플릿');
  box.append(kvTable(rows, ['env', '템플릿', '참조 key'], ['44px', null, '104px']));
  return box;
}

function metaSection(item) {
  const link = item.ref ? el('a', null, item.ref) : null;
  if (link) { link.href = item.ref; link.target = '_blank'; link.rel = 'noreferrer noopener'; }
  const rows = [
    ['key', el('span', null, item.key)],
    ['선언', el('span', 'badge ' + (item.declared === 'secret' ? 'secret' : 'public'), `${item.declared}.yaml`)],
    ['실효', el('span', 'badge ' + (isSecret(item) ? 'secret' : 'public'), item.visibility)],
    ['종류', item.resource_type || '—'],
    ['설명', item.desc || '—'],
    ['참고', link ?? '—'],
    ['env', Object.keys(item.values).filter((e) => item.values[e]).join(', ') || '—'],
    ['version', item.version],
  ];
  const box = section('메타데이터', btn('편집', () => openMetaModal(item), 'btn ghost'));
  const table = kvTable(rows);
  table.querySelectorAll('td').forEach((td) => td.classList.add('wrapv'));
  box.append(table);
  return box;
}

function aliasSection(item) {
  const add = btn('추가', () => {
    const alias = prompt(`${item.key}에 추가할 별칭`);
    if (alias) act(() => api('POST', `/alias/${encodeURIComponent(item.key)}`, { alias }), '별칭을 추가했습니다');
  }, 'btn ghost', 'plus');
  const box = section(`별칭 (${item.alias.length})`, add);
  if (item.alias.length === 0) {
    box.append(el('div', 'note', '별칭이 없습니다. 에이전트는 별칭으로 key를 찾습니다(§4.3).'));
    return box;
  }
  const rows = item.alias.map((alias) => {
    const del = iconBtn('trash', '별칭 삭제', () => act(
      () => api('DELETE', `/alias/${encodeURIComponent(item.key)}/${encodeURIComponent(alias)}`),
      '별칭을 삭제했습니다',
    ), 'warn');
    const wrap = el('div');
    wrap.style.cssText = 'display:flex;justify-content:flex-end';
    wrap.append(del);
    return [el('span', null, alias), wrap];
  });
  box.append(kvTable(rows, ['별칭', ''], [null, '32px']));
  return box;
}

function cliSection(item) {
  const env = state.envFilter === 'all' ? state.defaultEnv : state.envFilter;
  const commands = [
    ['값 조회', `dkc get ${item.key} --env ${env}`],
    ['템플릿 원본', `dkc get ${item.key} --env ${env} --raw`],
    ['env 주입 실행', `dkc exec --with ${item.key} --env ${env} -- <명령>`],
    ['별칭 검색', `dkc resolve "${item.alias[0] ?? item.key}"`],
  ];
  const box = section('CLI 사용법');
  const rows = commands.map(([label, cmd]) => {
    const line = el('div', 'cmd');
    line.append(el('code', null, cmd));
    line.append(iconBtn('copy', '명령 복사', () => copyText(cmd, false), 'hot'));
    return [el('span', null, label), line];
  });
  const table = kvTable(rows, ['용도', '명령'], ['74px', null]);
  box.append(table);
  box.append(el('div', 'note', '값을 에이전트 컨텍스트에 남기지 않으려면 get 대신 exec를 쓰세요(§4.3).'));
  return box;
}

/* ── 모달 ───────────────────────────────────────────────────── */
function openModal(title, buildBody, onSubmit, submitLabel = '저장') {
  const root = $('modal-root');
  root.textContent = '';
  const backdrop = el('div', 'backdrop');
  const modal = el('div', 'modal');
  const header = el('header');
  header.append(el('b', null, title));
  const x = iconBtn('close', '닫기', () => closeModal());
  x.style.marginLeft = 'auto';
  header.append(x);
  const body = el('div', 'body');
  const foot = el('footer');
  const form = el('form');
  form.onsubmit = (e) => { e.preventDefault(); onSubmit(); };
  buildBody(body);
  foot.append(btn('취소', () => closeModal(), 'btn'));
  const submit = el('button', 'btn primary');
  submit.type = 'submit';
  submit.textContent = submitLabel;
  foot.append(submit);
  form.append(body, foot);
  modal.append(header, form);
  backdrop.append(modal);
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  root.append(backdrop);
  const first = body.querySelector('input, textarea');
  if (first) setTimeout(() => first.focus(), 0);
}
function closeModal() { $('modal-root').textContent = ''; }
function modalOpen() { return $('modal-root').childElementCount > 0; }

function field(label, hint) {
  const box = el('div', 'field');
  box.append(el('label', null, label));
  const input = el('input');
  input.type = 'text';
  box.append(input);
  if (hint) box.append(el('div', 'hint', hint));
  return { box, input };
}

function openNewModal() {
  const key = field('key', '대문자·숫자·밑줄만. 예: ORDER_SERVICE_HOST');
  const type = field('종류 (resource_type)', '선택. 예: database, api-key');
  const alias = field('별칭', '쉼표로 구분. 에이전트가 이 말로 key를 찾습니다');
  const desc = field('설명', '선택');
  const refUrl = field('참고 링크', '선택. 콘솔·문서 URL');
  const envs = state.envs.length ? state.envs : ['prod', 'dev'];
  const valueInputs = new Map();
  let visibility = 'public';

  openModal('새 항목', (body) => {
    body.append(key.box);

    const vis = el('div', 'field');
    vis.append(el('label', null, '저장 위치'));
    const radios = el('div', 'radios');
    const make = (value, title, note) => {
      const r = el('label', 'radio' + (visibility === value ? ' on' : ''));
      const input = el('input');
      input.type = 'radio';
      input.name = 'vis';
      input.checked = visibility === value;
      input.onchange = () => {
        visibility = value;
        radios.querySelectorAll('.radio').forEach((n) => n.classList.remove('on'));
        r.classList.add('on');
      };
      const text = el('div');
      text.append(el('b', null, title), el('span', null, note));
      r.append(input, text);
      radios.append(r);
    };
    make('public', 'public.yaml', '평문 저장 · 호스트, 포트, 사용자명');
    make('secret', 'secret.yaml', 'sops+age 암호화 · 비밀번호, API 키');
    vis.append(radios);
    body.append(vis, type.box, alias.box, desc.box, refUrl.box);

    const valueBox = el('div', 'field');
    valueBox.append(el('label', null, '초기 값 (비우면 미설정)'));
    const table = el('table', 'kv');
    const tbody = el('tbody');
    for (const env of envs) {
      const tr = el('tr');
      tr.append(el('th', null, env));
      const td = el('td');
      const input = el('input');
      input.type = 'text';
      input.placeholder = '값 · 참조는 {{OTHER_KEY}}';
      input.style.cssText = 'width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:4px 6px;font:400 11.5px/1.5 var(--mono);color:var(--text)';
      valueInputs.set(env, input);
      td.append(input);
      tr.append(td);
      tbody.append(tr);
    }
    table.append(tbody);
    valueBox.append(table);
    body.append(valueBox);
  }, () => {
    const name = key.input.value.trim();
    if (!name) return toast('⚠️ key를 입력하세요');
    const filled = [...valueInputs].filter(([, input]) => input.value.trim() !== '');
    act(async () => {
      await api('POST', '/items', {
        key: name,
        visibility,
        resource_type: type.input.value.trim() || null,
        alias: alias.input.value.split(',').map((a) => a.trim()).filter(Boolean),
        desc: desc.input.value.trim() || null,
        ref: refUrl.input.value.trim() || null,
      });
      // 생성 API는 값을 받지 않는다(항상 prod/dev = null). 값은 만든 뒤 env마다 채운다.
      // 매번 version이 바뀌므로 직전 응답의 version을 이어 쓴다.
      let version = (await api('GET', `/alias/${encodeURIComponent(name)}`)).version;
      for (const [env, input] of filled) {
        const res = await api('PUT', `/value/${encodeURIComponent(name)}`, { env, value: input.value, version });
        version = res.version;
      }
    }, `${name}를 만들었습니다` + (filled.length ? ` · 값 ${filled.length}개를 채웠습니다` : ''), () => { state.selected = name; });
  }, '만들기');
}

function openMetaModal(item) {
  const type = field('종류 (resource_type)');
  const desc = field('설명');
  const refUrl = field('참고 링크');
  const alias = field('별칭', '쉼표로 구분');
  type.input.value = item.resource_type ?? '';
  desc.input.value = item.desc ?? '';
  refUrl.input.value = item.ref ?? '';
  alias.input.value = item.alias.join(', ');

  openModal(`${item.key} · 메타 편집`, (body) => {
    body.append(el('div', 'note', 'key와 값은 이 경로로 바꿀 수 없습니다. 값은 표에서 직접 편집하세요(스펙 §4.5).'));
    body.append(type.box, desc.box, refUrl.box, alias.box);
  }, () => {
    act(() => api('PUT', `/alias/${encodeURIComponent(item.key)}`, {
      resource_type: type.input.value.trim() || null,
      desc: desc.input.value.trim() || null,
      ref: refUrl.input.value.trim() || null,
      alias: alias.input.value.split(',').map((a) => a.trim()).filter(Boolean),
      version: item.version,
    }), `${item.key}의 메타를 저장했습니다`);
  });
}

/* ── 값 다루기 ──────────────────────────────────────────────── */
function maskOf(value) {
  return value === null || value === undefined ? '' : '●'.repeat(Math.min(24, Math.max(8, value.length)));
}

/**
 * .env 형식으로 클립보드에 복사한다. **파일로 내려받지 않는다** — 다운로드는
 * 평문을 디스크에 남기고, 그 순간 이 툴의 저장 경계가 무의미해진다(§4.4).
 */
function copyEnvFile(keys) {
  const env = state.envFilter === 'all' ? state.defaultEnv : state.envFilter;
  const lines = [];
  let skipped = 0;
  for (const key of keys) {
    const item = itemOf(key);
    const value = item?.values[env];
    if (!value || value.status !== 'set' || value.resolved === null) { skipped++; continue; }
    lines.push(`${key}=${/[\s"'#$]/.test(value.resolved) ? JSON.stringify(value.resolved) : value.resolved}`);
  }
  if (lines.length === 0) return toast(`⚠️ ${env}에 복사할 값이 없습니다`);
  const secrets = keys.filter((k) => itemOf(k) && isSecret(itemOf(k))).length;
  if (!confirm(`${env} 환경의 ${lines.length}개 값을 클립보드로 복사합니다.\n(secret ${secrets}개 포함)\n\n계속할까요?`)) return;
  copyValue(lines.join('\n'), `${lines.length}개를 .env 형식으로 복사했습니다` + (skipped ? ` (미설정 ${skipped}개 제외)` : ''));
}

/** 복사 후 30초 뒤 클립보드를 비운다 — 다른 앱이 나중에 붙여넣는 사고를 줄인다(§4.4). */
function copyValue(text, message) {
  copyText(text, true, message ?? '복사했습니다 · 30초 뒤 클립보드를 비웁니다');
}

async function copyText(text, autoClear, message) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(message ?? '복사했습니다');
  clearTimeout(state.clipboardTimer);
  if (!autoClear) return;
  state.clipboardTimer = setTimeout(async () => {
    try {
      const current = await navigator.clipboard.readText();
      if (current === text) await navigator.clipboard.writeText('');
    } catch { /* 권한이 없으면 조용히 넘어간다 */ }
  }, 30000);
}

async function act(fn, message, after) {
  try {
    await fn();
    state.editing = null;
    closeModal();
    await load();
    if (after) { after(); renderAll(); }
    toast(message);
  } catch (err) {
    toast('⚠️ ' + err.message);
  }
}

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => node.classList.remove('show'), 2800);
}

/** 전체 보기는 시간 제한을 둔다 — 자리를 비운 사이 화면에 평문이 남지 않게. */
function toggleRevealAll() {
  clearInterval(state.revealTimer);
  if (revealActive()) {
    state.revealAllUntil = 0;
    renderAll();
    return;
  }
  state.revealAllUntil = Date.now() + 15000;
  state.revealTimer = setInterval(() => {
    if (!revealActive()) {
      clearInterval(state.revealTimer);
      state.revealAllUntil = 0;
      renderAll();
      return;
    }
    renderFilters();
  }, 1000);
  renderAll();
}

/* ── 이벤트 배선 ────────────────────────────────────────────── */
$('logo').append(icon('send', 16));
$('qico').append(icon('search', 14));
$('q').addEventListener('input', (e) => { state.q = e.target.value; renderTable(); });
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; renderTable(); });
$('reload').onclick = () => act(() => api('POST', '/reload'), '파일을 다시 읽었습니다');
$('new').onclick = () => openNewModal();
$('revealall').onclick = () => toggleRevealAll();
$('envcopy').onclick = () => copyEnvFile(filtered().map((i) => i.key));

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderTable(), 150);
});

document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (modalOpen()) return closeModal();
    if (state.editing) { state.editing = null; return renderTable(); }
    if (document.activeElement === $('q') && state.q) { state.q = ''; $('q').value = ''; return renderTable(); }
    if (state.selected) { state.selected = null; renderTable(); renderInspector(); }
    return;
  }
  if (typing || modalOpen()) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    $('q').focus();
    $('q').select();
  }
});

load().catch((err) => {
  $('daemon').className = 'badge err';
  $('daemon').textContent = '연결 실패';
  toast('오류: ' + err.message);
});
</script>
</body>
